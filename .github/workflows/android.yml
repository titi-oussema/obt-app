name: Build Android test app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Copy the website into the Android app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/OBT-test-${{ github.run_number }}.apk"

      - name: Save the APK on this run
        uses: actions/upload-artifact@v4
        with:
          name: OBT-test-${{ github.run_number }}
          path: out/*.apk

      - name: Publish the APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: OBT test build ${{ github.run_number }}
          prerelease: true
          body: |
            Test build for Android. Open this page on your phone, tap the .apk file to download, then open it to install.
            If Android asks, allow "Install unknown apps" for your browser.
          files: out/*.apk
