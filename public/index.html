<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
@media (max-width:760px){input,select,textarea{font-size:16px!important}}
html.native .side-foot [data-k=reset]{display:none}
</style>
<title>OBT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: three-column social shell (nav / feed / market rail) that folds to one column with a bottom tab bar on phones. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F4F6F8; --line:#DAE0E6; --line-2:#C9D1D9;
  --fg:#111920; --muted:#5A6773; --faint:#8994A0;
  --accent:#A86A0C; --accent-ink:#FFFFFF; --accent-soft:rgba(168,106,12,.11);
  --long:#11865A; --short:#CF3D47; --long-soft:rgba(17,134,90,.12); --short-soft:rgba(207,61,71,.11);
  --candle-up:#11865A; --candle-down:#CF3D47;
  --shadow:0 1px 2px rgba(17,25,32,.05),0 8px 24px rgba(17,25,32,.06);
  --overlay:rgba(12,17,22,.5); --logo-halo:var(--surface); --trust:#0F7D78; --trust-ink:#FFFFFF; --trust-soft:rgba(15,125,120,.12);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1116; --surface:#131A21; --surface-2:#19222B; --line:#24303B; --line-2:#33414E;
  --fg:#E4EAF0; --muted:#8F9CA8; --faint:#66737F;
  --accent:#E6A83D; --accent-ink:#1B1204; --accent-soft:rgba(230,168,61,.13);
  --long:#33C188; --short:#F1636D; --long-soft:rgba(51,193,136,.13); --short-soft:rgba(241,99,109,.13);
  --candle-up:#33C188; --candle-down:#F1636D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --overlay:rgba(0,0,0,.6); --trust:#3CC4BC; --trust-ink:#06201E; --trust-soft:rgba(60,196,188,.14); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1116; --surface:#131A21; --surface-2:#19222B; --line:#24303B; --line-2:#33414E;
  --fg:#E4EAF0; --muted:#8F9CA8; --faint:#66737F;
  --accent:#E6A83D; --accent-ink:#1B1204; --accent-soft:rgba(230,168,61,.13);
  --long:#33C188; --short:#F1636D; --long-soft:rgba(51,193,136,.13); --short-soft:rgba(241,99,109,.13);
  --candle-up:#33C188; --candle-down:#F1636D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --overlay:rgba(0,0,0,.6); --trust:#3CC4BC; --trust-ink:#06201E; --trust-soft:rgba(60,196,188,.14); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;font-weight:600;font-size:.9rem;border:1px solid var(--line-2);background:var(--surface);transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.07)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{height:32px;padding:0 12px;font-size:.84rem;border-radius:8px}
.btn-block{width:100%}
.btn-danger{color:var(--short)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.badge-dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--short);color:#fff;font-size:.68rem;font-weight:600;display:grid;place-items:center;border:2px solid var(--surface)}

/* Topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;height:60px;display:flex;align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:-.02em}
.brand span em{font-style:normal;color:var(--accent)}
.search{flex:1;max-width:420px;position:relative;margin-left:24px}
.search input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px 0 40px;outline:none}
.search input:focus{border-color:var(--accent)}
.search .ic{position:absolute;left:12px;top:10px;color:var(--faint)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.dropdown{position:absolute;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:70;overflow:hidden}
.search-results{left:0;right:0;max-height:380px;overflow-y:auto}
.sr-item{display:flex;align-items:center;gap:10px;padding:10px 14px;width:100%;text-align:left}
.sr-item:hover{background:var(--surface-2)}
.sr-head{padding:10px 14px 4px}
.notif-panel{right:0;width:min(360px,calc(100vw - 32px))}
.notif-item{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;font-size:.9rem}
.notif-item:hover{background:var(--surface-2)}
.notif-item.unread{background:var(--accent-soft)}
.mobile-only{display:none}

/* Shell */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:28px;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell.wide{grid-template-columns:220px minmax(0,1fr)}
.side{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-weight:500;color:var(--muted);width:100%;text-align:left}
.nav-item:hover{background:var(--surface);color:var(--fg)}
.nav-item.active{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav-item .soon{margin-left:auto;font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.side-cta{margin-top:12px}
.side-foot{margin-top:20px;padding:14px 12px;border-top:1px solid var(--line);font-size:.8rem;color:var(--faint)}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.rail{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:16px;min-width:0}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px 18px}
.rail-card h3{font-size:.95rem;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small{font-size:.84rem}
.tiny{font-size:.76rem}
.strong{font-weight:600}

/* Avatars */
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;overflow:hidden;font-family:var(--f-body);letter-spacing:.01em}
.av img{width:100%;height:100%;object-fit:cover}
.gav{border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;flex:none}

/* Composer */
.composer{padding:14px 16px}
.c-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap}
.c-tab{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;font-weight:500;font-size:.88rem;color:var(--muted)}
.c-tab:hover{background:var(--surface-2);color:var(--fg)}
.c-tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
textarea,.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;outline:none;resize:vertical}
textarea:focus,.input:focus{border-color:var(--accent);background:var(--surface)}
.input{height:40px}
textarea{min-height:72px;line-height:1.5}
.c-text{border:0;background:transparent;padding:6px 2px;min-height:64px;font-size:1rem}
.c-text:focus{background:transparent}
.c-foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.c-foot .dest{max-width:220px;height:36px;padding:0 10px;font-size:.86rem}
.c-img{position:relative;margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--line);max-width:100%}
.c-img img{display:block;max-height:280px;width:100%;object-fit:cover}
.c-img button{position:absolute;top:8px;right:8px;background:var(--overlay);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface-2);height:40px}
.seg button{padding:0 14px;border-radius:7px;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button.on-long{background:var(--long);color:#fff}
.seg button.on-short{background:var(--short);color:#fff}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.rr-live{font-size:.84rem;padding:8px 12px;border-radius:8px;background:var(--surface-2);display:flex;gap:16px;flex-wrap:wrap}
.warn{color:var(--short)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line-2);font-size:.84rem;font-weight:500;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--surface-2);font-size:.75rem;font-weight:500;color:var(--muted)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{height:42px;padding:0 14px;font-weight:600;font-size:.9rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}

/* Post */
.post{padding:16px 18px}
.p-head{display:flex;gap:11px;align-items:flex-start}
.p-name{font-weight:600}
.p-name:hover,.link:hover{text-decoration:underline}
.p-meta{font-size:.8rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.p-meta .grp{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--fg)}
.p-body{margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.p-img{margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.p-img img{display:block;width:100%;max-height:440px;object-fit:cover}
.p-actions{display:flex;gap:4px;margin-top:12px;padding-top:8px;border-top:1px solid var(--line)}
.p-act{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:8px;color:var(--muted);font-size:.86rem;font-weight:500}
.p-act:hover{background:var(--surface-2);color:var(--fg)}
.p-act.liked{color:var(--short)}
.p-act.liked .ic,.p-act.saved .ic{fill:currentColor}
.p-act.saved{color:var(--accent)}
.pending-bar{margin-top:10px;font-size:.82rem;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:500;display:flex;gap:8px;align-items:center}
.menu-wrap{position:relative;margin-left:auto}
.menu{right:0;min-width:200px;padding:6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:.88rem}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Trade block */
.trade{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trade-top{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap;background:var(--surface-2)}
.pair{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:6px;font-size:.73rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pill-long{background:var(--long-soft);color:var(--long)}
.pill-short{background:var(--short-soft);color:var(--short)}
.pill-win{background:var(--long);color:#fff}
.pill-loss{background:var(--short);color:#fff}
.pill-open{background:var(--accent-soft);color:var(--accent)}
.pill-idea,.pill-be{background:var(--line);color:var(--fg)}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.lv{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.lv:last-child{border-right:0}
.lv .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.lv .v{font-family:var(--f-mono);font-weight:500;font-size:.92rem;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.chart{display:block;width:100%;height:auto;border-top:1px solid var(--line);background:var(--surface)}
.setup{padding:9px 14px;border-top:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.setup b{color:var(--fg);font-weight:600}

/* Journal entry block */
.jentry{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.jentry-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);flex-wrap:wrap}
.jentry .eyebrow{color:var(--accent)}
.jgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.jnotes{padding:10px 14px;border-top:1px solid var(--line);font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere}
.r-pos{color:var(--long)} .r-neg{color:var(--short)}

/* Comments */
.comments{margin-top:8px;display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:9px}
.cmt-bubble{background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.cmt-form{display:flex;gap:8px;align-items:center}
.cmt-form .input{height:38px;border-radius:19px}

/* Groups */
.g-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g-card{display:flex;flex-direction:column;overflow:hidden}
.g-card .band{height:64px;position:relative;display:block;width:100%}
.g-card .gav{position:absolute;left:16px;bottom:-22px;border:3px solid var(--surface)}
.g-card .body{padding:30px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.g-card .desc{font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-card .foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.g-hero{overflow:hidden}
.g-hero .band{height:120px;position:relative}
.g-hero .info{padding:0 20px 18px;display:flex;flex-direction:column;gap:8px}
.g-hero .gav{margin-top:-36px;border:4px solid var(--surface)}
.lockbox{text-align:center;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.lockbox .ic{color:var(--muted)}

/* Profile */
.cover{height:160px;background-size:cover;background-position:center;position:relative}
.p-info{padding:0 20px 18px;display:flex;flex-direction:column;gap:10px}
.p-info .av{margin-top:-48px;border:4px solid var(--surface)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.stat{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--f-mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:.74rem;color:var(--muted);font-weight:500}

/* Journal page */
.equity{display:block;width:100%;height:auto}
.j-table-wrap{overflow-x:auto}
table.j{width:100%;border-collapse:collapse;font-size:.86rem;min-width:640px}
table.j th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.j td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
table.j tr:last-child td{border-bottom:0}
table.j td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.j tr:hover td{background:var(--surface-2)}
.sample-note{font-size:.84rem;padding:10px 14px;border-radius:10px;background:var(--accent-soft);color:var(--fg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Messages */
.msg-shell{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 140px);min-height:480px;overflow:hidden}
.convo-list{border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.convo{display:flex;gap:10px;padding:12px 14px;align-items:center;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.convo:hover{background:var(--surface-2)}
.convo.on{background:var(--accent-soft)}
.chat{display:flex;flex-direction:column;min-width:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:min(75%,460px);padding:9px 13px;border-radius:16px;font-size:.92rem;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.them{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:5px}
.bub.mine{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:5px}
.bub-time{font-size:.7rem;color:var(--faint);align-self:center;margin:6px 0}
.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-form .input{border-radius:20px}
.typing{align-self:flex-start;font-size:.8rem;color:var(--muted);padding:4px 6px}
.empty{padding:40px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}

/* News */
.news-hero{padding:28px 24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;position:relative;overflow:hidden}
.news-preview{position:relative}
.news-preview .rows{filter:blur(3.5px);opacity:.65;pointer-events:none;user-select:none}
.news-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.impact{display:inline-flex;gap:3px}
.impact i{width:6px;height:14px;border-radius:2px;background:var(--line-2);display:block}
.impact i.on{background:var(--short)}
.news-lock{position:absolute;inset:0;display:grid;place-items:center}
.news-lock .card{padding:14px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-weight:600}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line-2);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}

/* Sessions */
.sess{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.88rem}
.sess .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.sess.open .dot{background:var(--long);box-shadow:0 0 0 3px var(--long-soft)}
.sess .hrs{margin-left:auto;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}

/* Modal */
.modal-back{position:fixed;inset:0;background:var(--overlay);z-index:90;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;width:min(560px,100%);box-shadow:var(--shadow);border:1px solid var(--line);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.swatches{display:flex;gap:8px}
.sw{width:32px;height:32px;border-radius:8px;border:2px solid transparent}
.sw.on{border-color:var(--fg)}
.upload-zone{border:1.5px dashed var(--line-2);border-radius:12px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);cursor:pointer}
.upload-zone:hover{border-color:var(--accent);color:var(--fg)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:3px;accent-color:var(--accent)}

/* Toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;font-weight:500;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);animation:tin .2s ease-out}
.toast button{color:var(--accent);font-weight:600}
@keyframes tin{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-brand{background:var(--surface);border-right:1px solid var(--line);padding:48px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px;justify-content:center}
.auth-brand h1{font-size:clamp(2rem,4vw,3.1rem);line-height:1.05;max-width:14ch}
.auth-brand h1 em{font-style:normal;color:var(--accent)}
.auth-brand p{color:var(--muted);max-width:44ch;margin:0;font-size:1.02rem}
.auth-sample{max-width:460px}
.auth-form{display:grid;place-items:center;padding:40px max(24px,env(safe-area-inset-right,0px)) 40px 24px}
.auth-card{width:min(420px,100%);display:flex;flex-direction:column;gap:16px}
.auth-note{font-size:.8rem;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.err{color:var(--short);font-size:.84rem;min-height:1.2em}
.divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:.8rem}
.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--line)}

/* Bottom nav */
.bottom-nav{display:none}

@media (max-width:1120px){
  .shell{grid-template-columns:200px minmax(0,1fr)}
  .rail{display:none}
}
@media (max-width:760px){
  .shell,.shell.wide{grid-template-columns:minmax(0,1fr);padding-block:14px 96px}
  .side{display:none}
  .search{display:none}
  .mobile-only{display:inline-grid}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:.68rem;font-weight:500;color:var(--muted)}
  .bn.active{color:var(--accent)}
  .g-grid{grid-template-columns:minmax(0,1fr)}
  .levels,.jgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lv:nth-child(2n){border-right:0}
  .lv:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(2n){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .msg-shell{grid-template-columns:minmax(0,1fr);height:calc(100vh - 170px)}
  .msg-shell.has-chat .convo-list{display:none}
  .msg-shell:not(.has-chat) .chat{display:none}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-brand{border-right:0;border-bottom:1px solid var(--line);padding:32px 16px}
  .auth-sample{display:none}
  .auth-form{padding:28px 16px 48px}
  .post{padding:14px}
  .cover{height:120px}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

/* Brand */
.brand{display:inline-flex;align-items:center;gap:0}
.brand .wm{font-family:var(--f-display);font-weight:700;font-size:1.62rem;letter-spacing:-.035em;line-height:1;margin-left:1px;color:var(--fg)}
.brand-lg .wm{font-size:2.75rem;margin-left:2px}
.tagline{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.feat{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px;max-width:48ch}
.feat li{display:flex;gap:11px;align-items:center;color:var(--muted)}
.feat li .ic{color:var(--accent)}
.feat b{color:var(--fg);font-weight:600}
/* Daily routine */
.day{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.day-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.streak{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:.82rem;font-weight:500}
.streak.on{background:var(--accent-soft);color:var(--accent)}
.streak b{font-size:1.25rem}
.streak-mini{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--faint)}
.streak-mini.on{color:var(--accent)}
.tasks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.task{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-align:left;font-size:.86rem;font-weight:500;transition:border-color .15s}
.task:hover{border-color:var(--accent)}
.task .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none}
.task.done{color:var(--muted)}
.task.done span:last-child{text-decoration:line-through;text-decoration-color:var(--line-2)}
.task.done .tick{background:var(--long);border-color:var(--long);color:#fff}
/* Bias */
.bias-list{display:flex;flex-direction:column;margin-top:10px}
.bias-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.bias-row:first-child{border-top:0}
.bias-btns{grid-column:2/4;display:flex;gap:8px;justify-content:flex-end}
.bias-btns .bull:hover{border-color:var(--long);color:var(--long)}
.bias-btns .bear:hover{border-color:var(--short);color:var(--short)}
.bias-btns .bear .ic{transform:scaleY(-1)}
.bias-bar{height:8px;border-radius:4px;background:var(--short);overflow:hidden}
.bias-bar div{height:100%;background:var(--long);border-right:2px solid var(--surface)}
.bias-pct{white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
/* Badges */
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;font-weight:600}
.badge.locked{background:var(--surface-2);color:var(--faint);border:1px dashed var(--line-2)}
/* Leaderboard */
.lb-podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pod{padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod:hover{border-color:var(--line-2)}
.pod .rank{font-family:var(--f-mono);font-weight:600;font-size:.8rem;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.pod.first{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.pod.first .rank{background:var(--accent);color:var(--accent-ink)}
.pod.is-me{background:var(--accent-soft)}
.pod .metric{font-family:var(--f-mono);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.lb-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.lb-row:first-child{border-top:0}
.lb-row:hover{background:var(--surface-2)}
.lb-row.me{background:var(--accent-soft)}
/* Tools */
.calc-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.co{background:var(--surface);padding:14px 16px;min-width:0}
.co .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.co .v{font-family:var(--f-mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.co.big .v{font-size:1.5rem;color:var(--accent)}
.be-row{display:grid;grid-template-columns:64px minmax(0,1fr) 44px;gap:12px;align-items:center}
.be-bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.be-bar div{height:100%;background:var(--accent);border-radius:5px}
.more-panel{right:0;width:230px}
@media (max-width:760px){
  .tasks{grid-template-columns:minmax(0,1fr)}
  .lb-podium{gap:8px}.pod{padding:14px 6px}.pod .metric{font-size:1.05rem}
  .calc-out{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bias-row{grid-template-columns:78px minmax(0,1fr) auto;gap:8px}
  .bias-pct .tag{display:none}
  .brand .wm{font-size:1.45rem}
}

/* Verification */
.vb{display:inline-flex;vertical-align:-3px;margin-left:4px;flex:none}
h1 .vb{vertical-align:-2px}
.tier-chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;font-size:.82rem;font-weight:600}
.tier-chip.pro{background:var(--accent-soft);color:var(--accent)}
.tier-chip.trusted{background:var(--trust-soft);color:var(--trust)}
.tier-chip.progress{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pbar{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.pbar.wide{display:block;width:100%;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--trust);border-radius:3px}
.tier-row{display:flex;gap:14px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line)}
.tier-row.on{border-color:var(--accent);background:var(--accent-soft)}
.tier-row>.ic,.tier-row>svg{flex:none}
.tier-row .ic{color:var(--short)}
.req{display:flex;gap:12px;align-items:center}
.req .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none}
.req .tick.ok{background:var(--long);border-color:var(--long);color:#fff}
.respect-btn.on{background:var(--short-soft);border-color:var(--short);color:var(--short)}
.respect-btn.on .ic{fill:currentColor}
.stats.ig .stat{text-align:center;width:100%}
button.stat:hover{background:var(--surface-2)}
/* Stories */
.stories{display:flex;gap:14px;padding:14px 16px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story-av{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:68px}
.story-av .nm{font-size:.74rem;color:var(--muted);max-width:68px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{position:relative;padding:3px;border-radius:50%;background:conic-gradient(from 200deg,var(--accent),var(--long),var(--accent));display:inline-grid;flex:none}
.ring .av{border:3px solid var(--surface)}
.ring.seen{background:var(--line-2)}
.ring.none{background:transparent}
.ring.big{padding:4px;margin-top:-52px}
.ring.big .av{margin-top:0!important;border-width:4px}
.ring .plus{position:absolute;right:0;bottom:0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--surface)}
.story-back{position:fixed;inset:0;z-index:95;background:rgba(3,5,8,.94);display:grid;place-items:center;padding:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.story{position:relative;width:min(420px,100%);height:min(760px,calc(100vh - 24px));border-radius:18px;overflow:hidden;color:#fff;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sbars{display:flex;gap:4px;padding:12px 12px 0;position:relative;z-index:3}
.sbar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sbar i{display:block;height:100%;width:0;background:#fff}
.sbar i.full{width:100%}
.sbar i.run{animation:sprog 6s linear forwards}
.sbar i.paused{animation-play-state:paused}
@keyframes sprog{from{width:0}to{width:100%}}
.shead{display:flex;align-items:center;gap:6px;padding:10px 10px 8px 12px;position:relative;z-index:3}
.shead .av{border:2px solid rgba(255,255,255,.7)}
.sbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff}
.sbtn:hover{background:rgba(255,255,255,.14)}
.sbody{flex:1;position:relative;display:flex;min-height:0}
.s-center{margin:auto;width:100%;padding:16px;display:flex;flex-direction:column;gap:14px}
.s-text{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1.2;text-align:center;text-wrap:balance;overflow-wrap:anywhere;padding:0 8px}
.s-cap{font-size:1rem;line-height:1.45;text-align:center;padding:0 6px}
.s-cap-over{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 18px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.s-img{width:100%;height:100%;object-fit:contain}
.s-tradecard{margin:0;background:var(--surface);color:var(--fg);border-color:transparent}
.szone{position:absolute;top:70px;bottom:70px;width:35%;z-index:2}
.szone.left{left:0}.szone.right{right:0}
.sreply{display:flex;gap:8px;padding:12px;position:relative;z-index:3}
.sreply .input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff;border-radius:20px}
.sreply .input::placeholder{color:rgba(255,255,255,.7)}
.sfoot{padding:14px;display:flex;align-items:center;gap:6px;opacity:.85;position:relative;z-index:3}
.story-preview{height:200px;border-radius:12px;display:grid;place-items:center;color:#fff;overflow:hidden;position:relative;padding:16px}
.story-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.story-preview .s-text{position:relative}
/* Academy */
.academy-hero{padding:22px 22px;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,var(--accent-soft),transparent 60%),var(--surface)}
.c-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.course-card{display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.course-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.cc-cover{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden}
.cover-svg{display:block;width:100%;height:100%}
.cc-type{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:6px;background:rgba(6,9,12,.62);color:#fff;font-size:.72rem;font-weight:600}
.cc-new{position:absolute;left:10px;bottom:10px;height:22px;padding:0 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;display:grid;place-items:center;letter-spacing:.04em;text-transform:uppercase}
.cc-wish{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:rgba(6,9,12,.55);color:#fff;display:grid;place-items:center}
.cc-wish.on{color:#ff6b78}.cc-wish.on .ic{fill:currentColor}
.cc-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cc-title{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.25}
.price{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.price.big{font-size:1.6rem}
.stars{display:inline-flex;align-items:center;gap:3px;color:var(--accent)}
.stars .ic{fill:currentColor}
.stars b{color:var(--fg);font-weight:600}
.rstars{color:var(--accent);font-size:.8rem;letter-spacing:1px}.rstars .off{color:var(--line-2)}
.strip{display:flex;gap:12px;overflow-x:auto;margin-top:12px;padding-bottom:4px;scroll-snap-type:x mandatory}
.strip .course-card{flex:0 0 236px;scroll-snap-align:start}
.course-cover{position:relative;aspect-ratio:16/7;max-width:100%;overflow:hidden}
.buybox{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.learn{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.learn li{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.learn .ic{color:var(--long);margin-top:2px}
.lesson{display:flex;align-items:center;gap:12px;width:100%;padding:12px 18px;border-top:1px solid var(--line);text-align:left;font-size:.92rem}
.lesson:hover{background:var(--surface-2)}
.lesson .ic{color:var(--faint)}
.lesson.free .grow{font-weight:600}
.mini-cover{width:110px;flex:none;aspect-ratio:16/9;border-radius:8px;overflow:hidden}
.checkout{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.checkout .strong{padding-top:8px;border-top:1px solid var(--line)}
.pay-opts{display:flex;gap:8px;flex-wrap:wrap}

/* Candle chart with position box (entry/stop/target) */
function tradeChart(id,t){
  const r=rng(id),e=+t.entry,sl=+t.sl,tp=+t.tp,long=t.dir==='long',risk=Math.abs(e-sl)||Math.abs(e)*.001,sg=long?1:-1;
  const amp=risk*.32,c=[];let price=e+sg*risk*1.1;
  const path=[];const n1=18;
  const sweep=e-sg*risk*.35;
  for(let i=1;i<=n1-3;i++)path.push(e+sg*risk*1.1+(sweep-(e+sg*risk*1.1))*(i/(n1-3)));
  path.push(sweep+sg*risk*.15,e,e+sg*risk*.1);
  const end={win:tp,loss:sl,be:e,open:e+sg*risk*.9,idea:null}[t.status];
  const n2=end==null?0:12;
  for(let i=1;i<=n2;i++){const k=i/n2;path.push(e+(end-e)*Math.pow(k,.9)+(Math.sin(i*1.3)*risk*.18*(1-k)))}
  for(const target of path){const o=price,cl=target+(r()-.5)*amp*.5;const h=Math.max(o,cl)+r()*amp*.55,l=Math.min(o,cl)-r()*amp*.55;c.push({o,c:cl,h,l});price=cl}
  if(t.status==='win'){const k=c[c.length-1];if(long)k.h=Math.max(k.h,tp);else k.l=Math.min(k.l,tp)}
  if(t.status==='loss'){const k=c[c.length-1];if(long)k.l=Math.min(k.l,sl);else k.h=Math.max(k.h,sl)}
  let lo=Math.min(sl,tp,...c.map(k=>k.l)),hi=Math.max(sl,tp,...c.map(k=>k.h));const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
  const W=600,Hh=190,gut=78,pw=W-gut,cw=pw/(n1+12);const y=v=>(hi-v)/(hi-lo)*Hh;
  const x0=(n1-1)*cw+cw/2, x1=pw-4;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="${esc(t.pair)} ${t.dir} chart with entry, stop and target">`;
  s+=`<rect x="${x0}" y="${Math.min(y(e),y(tp))}" width="${x1-x0}" height="${Math.abs(y(tp)-y(e))}" fill="var(--long-soft)"/>`;
  s+=`<rect x="${x0}" y="${Math.min(y(e),y(sl))}" width="${x1-x0}" height="${Math.abs(y(sl)-y(e))}" fill="var(--short-soft)"/>`;
  c.forEach((k,i)=>{const cx=i*cw+cw/2,up=k.c>=k.o,col=up?'var(--candle-up)':'var(--candle-down)';const bt=y(Math.max(k.o,k.c)),bb=y(Math.min(k.o,k.c));s+=`<line x1="${cx}" x2="${cx}" y1="${y(k.h)}" y2="${y(k.l)}" stroke="${col}" stroke-width="1.2"/><rect x="${cx-cw*.32}" y="${bt}" width="${cw*.64}" height="${Math.max(1.2,bb-bt)}" fill="${col}" rx="1"/>`});
  const line=(v,col,lab,dash)=>`<line x1="0" x2="${pw}" y1="${y(v)}" y2="${y(v)}" stroke="${col}" stroke-width="1" ${dash?'stroke-dasharray="4 4"':''} opacity=".85"/><rect x="${pw+4}" y="${y(v)-9}" width="${gut-6}" height="18" rx="4" fill="${col}"/><text x="${pw+4+(gut-6)/2}" y="${y(v)+4}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="10.5" font-weight="600" fill="var(--surface)">${lab}</text>`;
  s+=line(tp,'var(--long)','TP '+fmtPx(tp),true)+line(sl,'var(--short)','SL '+fmtPx(sl),true)+line(e,'var(--accent)',fmtPx(e),false);
  s+=`<circle cx="${x0}" cy="${y(e)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  return s+'</svg>';
}
function equitySVG(curve,h=150){
  const W=600,pad=24;const pts=[0,...curve];const lo=Math.min(0,...pts),hi=Math.max(1,...pts);const rng_=hi-lo||1;
  const x=i=>pad+(W-pad*2)*(i/(pts.length-1||1)),y=v=>8+(h-30)*(1-(v-lo)/rng_);
  const d=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area=d+`L${x(pts.length-1)},${y(lo)}L${x(0)},${y(lo)}Z`;const last=pts[pts.length-1],col=last>=0?'var(--long)':'var(--short)';
  let g='';for(let i=0;i<4;i++){const v=lo+rng_*i/3;g+=`<line x1="${pad}" x2="${W-pad}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad-4}" y="${y(v)+3}" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono,monospace" fill="var(--muted)">${(v>0?'+':'')+v.toFixed(1)}R</text>`}
  return `<svg class="equity" viewBox="0 0 ${W} ${h}" role="img" aria-label="Equity curve in R">${g}<line x1="${pad}" x2="${W-pad}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)" stroke-dasharray="3 3"/><path d="${area}" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(pts.length-1)}" cy="${y(last)}" r="4" fill="${col}" stroke="var(--surface)" stroke-width="2"/><text x="${W-pad}" y="${h-4}" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono,monospace" fill="var(--muted)">${pts.length-1} trades</text></svg>`;
}
function jStats(list){const withR=list.filter(e=>e.r!=null);const w=withR.filter(e=>e.r>0).length,l=withR.filter(e=>e.r<0).length;const tot=r2(withR.reduce((a,e)=>a+e.r,0));const sorted=[...withR].sort((a,b)=>a.date.localeCompare(b.date));let c=0;const curve=sorted.map(e=>r2(c+=e.r));const pnl=r2(list.reduce((a,e)=>a+(e.pnl||0),0));return{n:list.length,w,l,winrate:w+l?Math.round(w/(w+l)*100):0,totalR:tot,avgR:withR.length?r2(tot/withR.length):0,curve,pnl}}

function rrLive(){const d=UI.draft,e=num(d.entry),sl=num(d.sl),tp=num(d.tp);if([e,sl,tp].some(isNaN))return `<span class="muted">Fill entry, stop and target to see risk : reward</span>`;

const todayKey=()=>new Date().toISOString().slice(0,10);
function markActive(){const a=(DB.activity[DB.session]??=[]);const k=todayKey();if(!a.includes(k))a.push(k)}

function tasks(){const k=todayKey(),s0=new Date(k+'T00:00:00Z').getTime();
  const voted=Object.values(DB.bias[k]||{}).some(v=>v[DB.session]);

  const helped=DB.posts.some(p=>p.author!==DB.session&&p.comments.some(c=>c.by===DB.session&&c.t>=s0));
  return[{done:voted,label:"Vote today's market bias",act:'scrollBias'},{done:traded,label:'Log or share a trade',act:'logTrade'},{done:helped,label:"Comment on a trader's post",act:'goDiscover'}]}

    else h+=`<div class="card" style="overflow:hidden">${DB.courses.map(c=>`<div class="ad-post"><div class="mini-cover" style="width:72px">${coverSVG(c)}</div><div class="grow" style="min-width:0"><button class="strong small link" data-act="nav" data-view="course" data-arg="${c.id}">${esc(c.title)}</button><div class="tiny muted">by ${esc(user(c.author).name)} · ${priceTxt(c)} · ${fmtK(c.students)} students</div></div>${c.unlisted?'<span class="pill pill-loss">Unlisted</span>':'<span class="pill pill-long">Listed</span>'}<button class="btn btn-sm" data-act="adCourse" data-id="${c.id}">${c.unlisted?'Relist':'Unlist'}</button></div>`).join('')}</div>`;
  }
  return h}
function usersTable(list){return `<table class="j"><thead><tr><th>User</th><th>Email</th><th>Joined</th><th>Last active</th><th>Status</th><th>Badge</th><th>Reports</th><th></th></tr></thead><tbody>${list.map(u=>{const rc=DB.reports.filter(r=>(r.type==='user'&&r.target===u.id)||(r.type==='post'&&DB.posts.find(p=>p.id===r.target)?.author===u.id)).length;const t=tierOf(u.id);
  return `<tr class="ad-row" data-act="adUser" data-id="${u.id}"><td><div class="row" style="gap:8px">${av(u,30)}<div><div class="strong">${esc(u.name)}</div><div class="tiny muted">@${esc(u.username)}</div></div></div></td><td class="small">${esc(u.email||'—')}</td><td class="small">${new Date(u.joined).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}</td><td class="small">${lastActive(u.id)}</td><td>${statusPillU(u)}</td><td>${t==='pro'?PRO_SVG(18):t==='trusted'?TRUST_SVG(18):'<span class="muted">—</span>'}${(u.adminBadges||[]).length?`<span class="tag" style="margin-left:4px">+${u.adminBadges.length}</span>`:''}</td><td class="num ${rc?'r-neg strong':''}">${rc}</td><td><button class="btn btn-sm" data-act="adUser" data-id="${u.id}">Manage</button></td></tr>`}).join('')||`<tr><td colspan="8" class="muted" style="text-align:center;padding:24px">No users match.</td></tr>`}</tbody></table>`}
function adminUserModal(id){const u=user(id),self=id===DB.session,b=isBlocked(id),t=tierOf(id);
  const posts=DB.posts.filter(p=>p.author===id).length,rAgainst=DB.reports.filter(r=>(r.type==='user'&&r.target===id)||(r.type==='post'&&DB.posts.find(p=>p.id===r.target)?.author===id)).length,rMade=DB.reports.filter(r=>r.by===id).length;
  const groupsOwned=DB.groups.filter(g=>g.owner===id).map(g=>g.name);
  const kv=(k,v)=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`;
  return `<div class="row" style="gap:12px">${av(u,56)}<div class="grow" style="min-width:0"><div class="strong" style="font-size:1.1rem">${esc(u.name)}${vb(u,16)}</div><div class="small muted">@${esc(u.username)}</div></div>${statusPillU(u)}</div>
  <div class="kv-grid">${kv('Email',`<span class="mono small">${esc(u.email||'—')}</span>`)}${kv('User ID',`<span class="mono small">${esc(u.id)}</span>`)}${kv('Joined',new Date(u.joined).toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'}))}${kv('Last active',lastActive(id))}${kv('Location',esc(u.location||'—'))}${kv('Markets',esc((u.markets||[]).join(', ')||'—'))}${kv('Posts',posts)}${kv('Followers',fmtK(followers(id)))}${kv('Respect',fmtK(respectCount(id)))}${kv('Reports against',`<span class="${rAgainst?'r-neg':''}">${rAgainst}</span>`)}${kv('Reports made',rMade)}${kv('Groups owned',esc(groupsOwned.join(', ')||'—'))}</div>
  <div class="ad-sec"><h3>Account status</h3>${self?`<div class="small muted">You can't suspend your own account.</div>`:b?`<div class="soon-box" style="background:var(--short-soft)">${ic('ban',18)}<div class="grow"><div class="strong">Suspended ${u.blocked.until?'until '+new Date(u.blocked.until).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'permanently'}</div><div class="small muted">Reason: ${esc(u.blocked.reason||'—')}</div></div></div><button class="btn btn-sm" data-act="adUnblock" data-id="${id}">Lift suspension</button>`:
  `<div class="grid2"><div class="field"><label for="ad-dur">Suspend for</label><select class="input" id="ad-dur"><option value="1">24 hours</option><option value="7">7 days</option><option value="30">30 days</option><option value="0">Permanently</option></select></div><div class="field"><label for="ad-reason">Reason (the user sees this)</label><input class="input" id="ad-reason" placeholder="e.g. Selling signals" maxlength="120"></div></div><button class="btn btn-sm btn-danger" data-act="adBlock" data-id="${id}" style="border-color:var(--short)">${ic('ban',15)}Suspend account</button>`}</div>
  <div class="ad-sec"><h3>Verification badge</h3><div class="seg">${[['none','None'],['trusted','Trusted'],['pro','Verified Pro']].map(([k,l])=>`<button type="button" class="${(u.verified||'none')===k?'on':''}" data-act="adVerify" data-id="${id}" data-k="${k}">${l}</button>`).join('')}</div><div class="tiny muted">Now showing: ${t==='pro'?'Verified Pro':t==='trusted'?'Trusted'+(u.verified==='trusted'?' (given by admin)':' (earned with respect)'):'no badge'}</div></div>
  <div class="ad-sec"><h3>Special badges</h3><div class="chips">${ADMIN_BADGES.map(x=>`<button class="chip ${(u.adminBadges||[]).includes(x)?'on':''}" data-act="adBadge" data-id="${id}" data-k="${x}">${(u.adminBadges||[]).includes(x)?ic('check',14):''}${x}</button>`).join('')}</div></div>
  <div class="ad-sec"><h3>Role</h3><label class="check"><input type="checkbox" id="ad-admin" data-act="adRole" data-id="${id}" ${u.role==='admin'?'checked':''} ${self?'disabled':''}><span>Admin (can open this panel and moderate)</span></label></div>
  <div class="ad-sec"><h3>Message as OBT Team</h3><form class="r-form" data-form="adMsg" data-id="${id}"><input class="input" id="ad-msg" placeholder="Write a warning or a note…" autocomplete="off"><button class="btn btn-sm">${ic('send',15)}Send</button></form></div>`}
function sendAsTeam(to,text){let c=DB.convos.find(x=>x.parts.includes('obt')&&x.parts.includes(to));if(!c){c={id:uid('c'),parts:['obt',to],msgs:[]};DB.convos.push(c)}c.msgs.push({from:'obt',text,t:Date.now()});notify(to,'<b>OBT Team</b> sent you a message',['messages',c.id])}

  <div style="position:relative"><button class="icon-btn" data-act="notif" aria-label="Notifications">${ic('bell')}${nUnread?`<span class="badge-dot">${nUnread}</span>`:''}</button>${UI.notif?notifPanel():''}</div>

  <button class="btn btn-primary btn-block side-cta" data-act="newTrade">${ic('plus',18)}Share a trade</button>
  <div class="side-foot"><div class="row">${av(u,30)}<div class="grow"><div class="small strong ellipsis">${esc(u.name)}</div><div class="tiny ellipsis">@${esc(u.username)}</div></div><span class="streak-mini ${streak()?'on':''}" title="Day streak">${ic('flame',15)}${streak()}</span></div><div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-act="logout">${ic('logout',15)}Log out</button><button class="btn btn-ghost btn-sm" data-act="modal" data-k="reset">${ic('reset',15)}Reset</button></div></div></nav>

}
function mainView(){switch(UI.view){case'groups':return viewGroups();case'group':return viewGroup(UI.arg);case'journal':return viewJournal();case'messages':return viewMessages(UI.arg);case'news':return viewNews();case'leaderboard':return viewLeaderboard();case'academy':return viewAcademy();case'course':return viewCourse(UI.arg);case'admin':return viewAdmin();case'tools':return viewTools();case'profile':return viewProfile(UI.arg||DB.session);default:return viewHome()}}

function notifPanel(){const ns=myNotifs();return `<div class="dropdown notif-panel"><div class="row between" style="padding:12px 14px"><h3>Notifications</h3>${ns.some(n=>!n.read)?`<button class="small link" style="color:var(--accent);font-weight:600" data-act="readAll">Mark all read</button>`:''}</div><div style="max-height:380px;overflow-y:auto">${ns.length?ns.map(n=>`<button class="notif-item ${n.read?'':'unread'}" data-act="openNotif" data-id="${n.id}">${ic('bell',18)}<div class="grow"><div>${n.text}</div><div class="tiny muted">${ago(n.t)}</div></div></button>`).join(''):`<div class="empty small">You're all caught up.</div>`}</div></div>`}

  if(m.k==='entry'){const ex=m.id?DB.journal.find(e=>e.id===m.id):null;

  if(t==='signup'){h+=`<div><h2>Create your account</h2><div class="small muted">Free forever. Takes one minute.</div></div>${inp('a-name','name','Full name','text','name','Your name')}
    <div class="field"><label for="a-user">Username</label><div class="at-wrap"><span>@</span><input class="input ${E.username?'bad':''}" id="a-user" data-af="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="yourname" value="${esc(A.username||'')}"></div><div id="un-hint">${E.username?'':unHint(A.username)}</div>${fe('username')}</div>

const pickState={k:null};
function pickFile(k,accept){const f=document.getElementById('file-any');f.accept=accept||'image/*';f.value='';pickState.k=k;f.click()}
async function onFile(file){
  const k=pickState.k;if(!file)return;
  if(k==='html'){const text=await file.text();const rows=parseJournalHtml(text);UI.modal={k:'import',file:file.name,rows,raw:text};render();return}

function readImage(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function parseJournalHtml(html){
  const doc=new DOMParser().parseFromString(html,'text/html');const out=[];
  const mapH=cells=>{const m={};cells.forEach((c,i)=>{c=c.replace(/\s+/g,' ').trim();
    if(m.pair==null&&/^(symbol|pair|instrument|item|asset|market|ticker)$/.test(c))m.pair=i;
    else if(m.dir==null&&/^(type|side|direction|buy\/sell|long\/short|action)$/.test(c))m.dir=i;
    else if(/^(s ?\/ ?l|sl|stop|stop loss)$/.test(c)){if(m.sl==null)m.sl=i}
    else if(/^(t ?\/ ?p|tp|target|take profit)$/.test(c)){if(m.tp==null)m.tp=i}
    else if(/^price$/.test(c)){if(m.entry==null)m.entry=i;else if(m.exit==null)m.exit=i}
    else if(m.entry==null&&/(entry|open price)/.test(c))m.entry=i;
    else if(m.exit==null&&/(exit|close price)/.test(c))m.exit=i;
    else if(m.pnl==null&&/(profit|p&l|p\/l|pnl|net)/.test(c))m.pnl=i;
    else if(m.r==null&&/^(r|r multiple|r-multiple|result \(r\)|rr|r:r)$/.test(c))m.r=i;
    else if(m.date==null&&/(date|time)/.test(c))m.date=i;
    else if(m.notes==null&&/(note|comment|setup|reason)/.test(c))m.notes=i;});return m};
  doc.querySelectorAll('table').forEach(tb=>{let map=null;
    tb.querySelectorAll('tr').forEach(tr=>{const cells=[...tr.children].map(c=>c.textContent.trim());if(!cells.length)return;
      const m=mapH(cells.map(c=>c.toLowerCase()));if(m.pair!=null&&(m.entry!=null||m.pnl!=null||m.r!=null)){map=m;return}
      if(!map)return;const pair=(cells[map.pair]||'').toUpperCase().replace(/[^A-Z0-9.!]/g,'');if(!pair||pair.length>14)return;
      const dt=(cells[map.dir]||'').toLowerCase();const dir=/sell|short/.test(dt)?'short':/buy|long/.test(dt)?'long':(map.dir==null?'long':null);if(!dir)return;
      const e={id:uid('j'),owner:DB.session,pair,dir,entry:num(cells[map.entry]),exit:num(cells[map.exit]),sl:num(cells[map.sl]),tp:num(cells[map.tp]),setup:map.notes!=null?'':'Imported',emotion:'',notes:map.notes!=null?cells[map.notes]:'',img:null,source:'import'};
      for(const k of['entry','exit','sl','tp'])if(isNaN(e[k])||e[k]===0)e[k]=null;
      let d=cells[map.date]||'';d=d.replace(/\./g,'-').slice(0,10);e.date=/^\d{4}-\d{2}-\d{2}$/.test(d)?d:today();
      const rv=map.r!=null?num(String(cells[map.r]).replace(/r$/i,'')):NaN;e.r=!isNaN(rv)?rv:calcR(e);
      const pv=map.pnl!=null?num(cells[map.pnl]):NaN;e.pnl=isNaN(pv)?(e.r!=null?null:null):pv;
      if(e.r==null&&e.pnl==null&&e.entry==null)return;
      out.push(e)})});
  return out.slice(0,500);
}

    DB.groups.unshift(g);setMem(g.id,'owner');UI.modal=null;UI.mdraft={};save();go('group',g.id);toast('Group created');return}
  if(k==='editProfile'){const md=UI.mdraft,u=me();const un=(md.username??u.username).trim().toLowerCase();
    if(!/^[a-z0-9_.]{3,20}$/.test(un)){md.err='Username: 3–20 characters, letters, numbers, _ or .';render();return}
    if(Object.values(DB.users).some(x=>x.id!==u.id&&x.username===un)){md.err='That username is taken.';render();return}
    if(!(md.name??u.name).trim()){md.err='Name cannot be empty.';render();return}
    Object.assign(u,{name:(md.name??u.name).trim(),username:un,bio:(md.bio??u.bio??'').trim(),location:(md.location??u.location??'').trim(),style:md.style??u.style,markets:md.markets,avatar:md.avatar||null,cover:md.cover||null});
    UI.modal=null;UI.mdraft={};save();render();toast('Profile saved');return}
  if(k==='entry'){const md=UI.mdraft;if(!(md.pair||'').trim()){md.err='Add the pair.';render();return}
    const e={pair:md.pair.trim().toUpperCase(),dir:md.dir,date:md.date||today(),entry:isNaN(num(md.entry))?null:num(md.entry),exit:isNaN(num(md.exit))?null:num(md.exit),sl:isNaN(num(md.sl))?null:num(md.sl),tp:null,setup:(md.setup||'').trim(),emotion:md.emotion,notes:(md.notes||'').trim(),img:md.img||null};
    if(e.entry==null||e.exit==null){md.err='Entry and exit prices are needed.';render();return}
    e.r=calcR(e);const pv=num(md.pnl);e.pnl=isNaN(pv)?(e.r!=null?r2(e.r*100):null):pv;
    const ex=UI.modal.id&&DB.journal.find(x=>x.id===UI.modal.id);if(ex){Object.assign(ex,e,{sample:false});toast('Entry updated')}else{markActive();DB.journal.push({id:uid('j'),owner:DB.session,createdAt:Date.now(),...e});toast('Entry added to your journal')}
    UI.modal=null;UI.mdraft={};save();render();return}
  if(k==='report'){const md=UI.mdraft,m=UI.modal;if(!md.reason){md.err='Pick a reason.';render();return}
    DB.reports.push({id:uid('r'),by:DB.session,type:m.kind,target:m.id,reason:md.reason,details:(md.details||'').trim(),t:Date.now(),status:'open',replies:[]});
    for(const u of Object.values(DB.users))if(u.role==='admin'&&u.id!==DB.session)notify(u.id,`New report: <b>${esc(md.reason)}</b>`,['admin']);
    UI.modal=null;UI.mdraft={};save();render();toast('Thanks. Our team will review your report.');return}
  if(k==='reportReply'){const r=DB.reports.find(x=>x.id===f.dataset.id);const txt=((UI.rrDraft||{})[r.id]||'').trim();if(!txt)return;r.replies.push({from:'obt',text:txt,t:Date.now()});sendAsTeam(r.by,`About your report (${r.reason}): ${txt}`);UI.rrDraft[r.id]='';save();render();toast(`Reply sent to ${user(r.by).name}`);return}
  if(k==='adMsg'){const inp=f.querySelector('input'),txt=inp.value.trim();if(!txt)return;sendAsTeam(f.dataset.id,txt);save();inp.value='';toast(`Message sent to ${user(f.dataset.id).name} from OBT Team`);return}
  if(k==='sellCourse'){const md=UI.mdraft,title=(md.title||'').trim();if(!title){md.err='Give your course a title.';render();return}
    const price=Math.max(0,num(md.price)||0);const ls=(md.lessons||'').split('\n').map(x=>x.trim()).filter(Boolean);if(!ls.length){md.err='Add at least one lesson or chapter.';render();return}
    const c={id:uid('c'),author:DB.session,title,type:md.type||'video',level:md.level||'Beginner',market:md.market||'Forex',price:Math.round(price*100)/100,rating:0,reviewsCount:0,students:0,length:md.type==='pdf'?`${ls.length*6} pages`:`${ls.length} lessons`,color:md.color||'gold',isNew:true,desc:(md.desc||'').trim()||'A new course on OBT Academy.',learn:ls.slice(0,4),lessons:ls.map((t,i)=>({title:t,len:md.type==='pdf'?`ch. ${i+1}`:'—',preview:i===0,summary:i===0?((md.desc||'').trim()||'Free preview of this course.'):''})),reviews:[]};
    c.rating=0.0;DB.courses.unshift(c);UI.modal=null;UI.mdraft={};markActive();save();go('course',c.id);toast('Your course is listed on the Academy');return}
  if(k==='addStory'){const md=UI.mdraft;const txt=(md.text||'').trim();if(!txt&&!md.img){toast('Write something or add a photo.');return}
    DB.stories.push({id:uid('s'),author:DB.session,t:Date.now(),kind:md.img?'image':'text',color:md.color||'gold',text:txt,img:md.img||null});UI.modal=null;UI.mdraft={};markActive();save();render();toast('Added to your story');return}
  if(k==='storyReply'){const inp=f.querySelector('input'),txt=inp.value.trim();if(!txt)return;const to=f.dataset.id;let c=DB.convos.find(x=>x.parts.includes(DB.session)&&x.parts.includes(to));if(!c){c={id:uid('c'),parts:[DB.session,to],msgs:[]};DB.convos.push(c)}c.msgs.push({from:DB.session,text:'Replied to your story: '+txt,t:Date.now()});save();inp.value='';inp.blur();UI.storyPaused=false;toast('Reply sent to messages');storyNext();return}
  if(k==='share'){const m=UI.modal,md=UI.mdraft,dest=md.dest||'';const p={id:uid('p'),author:DB.session,groupId:dest||null,text:(md.text||'').trim(),img:null,t:Date.now(),likes:[],comments:[],saves:[],status:'live'};
    if(m.kind==='entry'){const e=DB.journal.find(x=>x.id===m.id);const{owner,sample,id:_,...snap}=e;p.type='journal';p.entry=snap;p.img=e.img||null}
    else{const s=jStats(myJournal());p.type='recap';p.recap={trades:s.n,winrate:s.winrate,totalR:s.totalR,avgR:s.avgR,curve:s.curve,label:'My journal'}}
    const g=dest?group(dest):null;if(g&&g.approval&&memOf(dest)!=='owner'){p.status='pending';p.pendingAt=Date.now()}
    markActive();DB.posts.unshift(p);UI.modal=null;UI.mdraft={};save();render();toast(p.status==='pending'?'Sent to the admins for approval':g?`Shared in ${g.name}`:'Shared to your profile');return}
}

/* ============ Wiring ============ */
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('course-card')){e.preventDefault();e.target.click()}});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||!['menu','notif','more'].includes(el.dataset.act)){let ch=false;
    if(UI.more&&!e.target.closest('.more-panel')){UI.more=false;ch=true}
    if(UI.menu&&!e.target.closest('.menu')){UI.menu=null;ch=true}
    if(UI.notif&&!e.target.closest('.notif-panel')){UI.notif=false;ch=true}
    if(UI.search&&!e.target.closest('.search')){UI.search='';ch=true}
    if(ch&&!el){render();return}}
  if(!el)return;
  if(el.dataset.act==='toggleApproval'){act('toggleApproval',el,e);return}
  act(el.dataset.act,el,e);
});
document.addEventListener('submit',e=>{e.preventDefault();onForm(e.target)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.d){UI.draft[t.dataset.d]=t.value;if(['entry','sl','tp'].includes(t.dataset.d)){const r=document.getElementById('rr-live');if(r)r.innerHTML=rrLive()}if(t.dataset.rerender)render();return}
  if(t.dataset.cd){UI.cdraft[t.dataset.cd]=t.value;return}
  if(t.dataset.af){const k=t.dataset.af;UI.af[k]=t.value;if(UI.authErrs&&UI.authErrs[k]){delete UI.authErrs[k];t.classList.remove('bad');t.closest('.field')?.querySelector('.ferr')?.remove()}
    if(k==='password'){const m=document.getElementById('pw-meter');if(m)m.innerHTML=meterHtml(t.value)}if(k==='username'){const h=document.getElementById('un-hint');if(h)h.innerHTML=unHint(t.value)}return}
  if(t.dataset.ob){const u=me();u[t.dataset.ob]=t.value;save();return}
  if(t.dataset.rr){(UI.rrDraft??={})[t.dataset.rr]=t.value;return}
  if(t.dataset.adq){UI.adQ=t.value;const users=Object.values(DB.users).filter(u=>!u.system&&!u.staff);const q=t.value.toLowerCase(),f=UI.adF||'all';let list=users.filter(u=>(u.name+' '+u.username+' '+(u.email||'')).toLowerCase().includes(q));if(f==='active')list=list.filter(u=>!isBlocked(u.id));if(f==='blocked')list=list.filter(u=>isBlocked(u.id));if(f==='pro')list=list.filter(u=>tierOf(u.id));if(f==='admin')list=list.filter(u=>u.role==='admin');document.getElementById('ad-users').innerHTML=usersTable(list.sort((a,b)=>b.joined-a.joined));return}
  if(t.dataset.calc){UI.calc[t.dataset.calc]=t.value;if(t.dataset.calc==='inst')render();else{const o=document.getElementById('calc-out');if(o)o.innerHTML=calcOut()}return}
  if(t.dataset.chat){UI.chat=t.value;return}
  if(t.dataset.md){UI.mdraft[t.dataset.md]=t.value;if(t.dataset.liveStory){const pv=document.querySelector('.story-preview .s-text');if(pv)pv.textContent=t.value||'Your text here'}if(t.dataset.live){const r=calcR(UI.mdraft);const el=document.getElementById('j-rlive');if(el)el.innerHTML=`Result: <b class="mono">${r==null?'fill entry, stop and exit':fmtR(r)}</b>`}return}
  if(t.dataset.mdCheck){UI.mdraft[t.dataset.mdCheck]=t.checked;return}
  if(t.id==='search'){UI.search=t.value;const box=t.parentElement;box.querySelector('.search-results')?.remove();if(t.value.trim())box.insertAdjacentHTML('beforeend',searchResults())}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.afCheck){UI.af[t.dataset.afCheck]=t.checked;if(t.checked&&UI.authErrs?.terms){delete UI.authErrs.terms;t.closest('form').querySelector('.check+.ferr')?.remove()}}if(t.dataset.ob){me()[t.dataset.ob]=t.value;save()}if(t.id==='file-any')onFile(t.files[0]);if(t.dataset.mdCheck)UI.mdraft[t.dataset.mdCheck]=t.checked});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.sreply&&UI.story){UI.storyPaused=true;clearTimeout(storyTimer);document.querySelector('.sbar i.run')?.classList.add('paused')}});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.sreply&&UI.story&&UI.storyPaused){UI.storyPaused=false;setTimeout(()=>{if(UI.story&&!UI.storyPaused)render()},150)}});
document.addEventListener('keydown',e=>{if(UI.story&&!e.target.dataset?.sreply){if(e.key==='ArrowRight'){storyNext();return}if(e.key==='ArrowLeft'){storyPrev();return}}if(e.key==='Escape'&&UI.story){UI.story=null;render();return}if(e.key==='Escape'){if(UI.modal){UI.modal=null;UI.mdraft={};render()}else if(UI.menu||UI.notif||UI.search){UI.menu=null;UI.notif=false;UI.search='';render()}}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render())}catch(e){}

applyTheme();load();if(DB.session&&isBlocked(DB.session)){DB.session=null;UI.authTab='login';UI.authErr='Your account is suspended.'}render();setInterval(tick,2000);
</script>

<script>
/* App shell: native (Android) hooks and offline support for the installable web app */
(function(){
  var C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()){
    document.documentElement.classList.add('native');
    var P=C.Plugins||{};
    try{if(P.StatusBar){P.StatusBar.setStyle({style:'DARK'});P.StatusBar.setBackgroundColor({color:'#0C1116'})}}catch(e){}
    try{if(P.App)P.App.addListener('backButton',function(){
      if(UI.story){UI.story=null;render();return}
      if(UI.modal){UI.modal=null;UI.mdraft={};render();return}
      if(UI.menu||UI.notif||UI.more||UI.search){UI.menu=null;UI.notif=false;UI.more=false;UI.search='';render();return}
      if(DB.session&&me()&&me().onboarded===false){if((UI.obStep||1)>1){UI.obStep--;render();return}P.App.exitApp();return}
      if(DB.session&&UI.view!=='home'){go(isAdmin()&&UI.view!=='admin'?'admin':'home');return}
      P.App.exitApp();
    })}catch(e){}
  }else if('serviceWorker' in navigator&&location.protocol==='https:'){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
})();
</script>
